<div class="checker">

  <div class="checker-top">
    <div>
      <small>CEK NOMOR</small>
      <strong>Masukkan nomor XL atau AXIS</strong>
    </div>
  </div>

  <div class="input-box">

    <div class="country">
      <span>🇮🇩</span>
      <strong>+62</strong>
    </div>

    <input
      id="msisdn"
      type="tel"
      inputmode="numeric"
      autocomplete="off"
      placeholder="838xxxxxxxx"
      maxlength="15"
    >

    <button
      type="button"
      id="pasteBtn"
      class="paste-btn"
    >
      PASTE
    </button>

  </div>

  <button
    id="checkBtn"
    class="check-btn"
  >
    <span id="buttonText">
      CEK NOMOR
      <span class="arrow">→</span>
    </span>

    <span
      id="loading"
      class="loading hidden"
    ></span>
  </button>

  <div
    id="error"
    class="error hidden"
  ></div>

  <div class="checker-info">
    <span>✓ XL</span>
    <span>✓ AXIS</span>
    <span>✓ Cepat</span>
  </div>

</div>
